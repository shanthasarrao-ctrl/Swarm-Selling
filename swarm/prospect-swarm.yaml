# Prospect swarm — a cold account, no open opportunity.
#
# Shorter chain than the deal swarm. No deal management, no forecasting, and
# for Tier 3 no adversarial round.

name: prospect-swarm
description: Cold outbound. Cheaper, shallower, with the same gates.
applies_to: [tier-2, tier-3]

budget:
  max_spend_usd: 1.50
  on_exceed: cancel_remaining

waves:

  - wave: 1
    name: identity
    agents: [identity-resolver]

  - wave: 2
    name: research
    parallel: true
    agents:
      - account-analysis
      - private-company
      - intent-finder
      - market-perception    # what the buyer already believes
      - lead-analysis

  - wave: 3
    name: thesis
    agents: [pov-finder]

  - wave: 4
    name: scoring
    agents: [intent-scorer]     # evidence only; never sees a draft
    note: Sets the gate for wave 5 on Tier 2.

  - wave: 5
    name: adversarial
    sequential: true
    agents: [competitor-rep, buyer-adjudicator, gap-analysis]
    skip_if: tier == 3
    on_case_lost: halt

  - wave: 6
    name: draft
    agents: [email-draft, linkedin-message]
    gate: tier_and_rubric
    precondition: touch_cap_not_reached

  - wave: 7
    name: critique
    sequential: true
    agents: [buyer-persona, persona-critique, message-rewrite]
    max_iterations: 2

  - wave: 8
    name: check
    agents: [quality-gate, signal-dedupe]

  - wave: 9
    name: human
    agents: []
    note: Drafts only. A human sends.
