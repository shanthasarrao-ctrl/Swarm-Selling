# Monday research run.
#
# This runs on YOUR fork, with YOUR key, at YOUR cost. Add ANTHROPIC_API_KEY as
# a repository secret before enabling. Run /gtm-dry-run first to see what a
# Monday costs.

name: weekly

on:
  schedule:
    - cron: "0 13 * * 1"      # Mondays 13:00 UTC — adjust to your timezone
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAX_SPEND_USD: "10.00"       # hard ceiling; run cancels remaining work
      INTERRUPT_BUDGET: "5"        # items surfaced per week, whole territory

    steps:
      - uses: actions/checkout@v4

      - name: Guard — key present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret. See README."
            exit 1
          fi

      - name: Validate spec
        run: |
          if grep -rq "Replace everything below" spec/; then
            echo "spec/ still contains placeholder content. Run /gtm-init."
            exit 1
          fi

      - name: Run orchestrator
        run: |
          echo "Runs agents/orchestrator.md against swarm/*.yaml."
          echo "Wire this to your harness — Claude Code CLI or equivalent."
          echo "Autonomous research only. Nothing in this repo can send."

      - name: Commit logs
        run: |
          git config user.name "swarmselling"
          git config user.email "noreply@github.com"
          git add -A log/ || true
          git diff --staged --quiet || git commit -m "weekly run $(date -u +%F)"
          git push || true
